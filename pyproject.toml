[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "solesonic-litellm-plugins"
version = "0.1.0"
description = "LiteLLM proxy plugins: tokens-per-second in streamed chat completion usage"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Isaac Peel" }]
keywords = ["litellm", "llm", "proxy", "plugin", "callback", "tokens-per-second"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
]
# litellm is deliberately not a runtime dependency: the plugin runs inside an existing
# LiteLLM proxy, and declaring it would let pip upgrade or downgrade the proxy's own litellm.
dependencies = []

[project.optional-dependencies]
dev = ["litellm[proxy]>=1.104.2", "pytest>=8", "pytest-asyncio>=0.24"]

[project.urls]
Homepage = "https://github.com/isaacpeel/solesonic-litellm-plugins"

[tool.hatch.build.targets.wheel]
packages = ["src/solesonic_litellm_plugins"]

[tool.pytest.ini_options]
testpaths = ["tests"]
